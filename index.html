<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chonla</title>
    <link rel="stylesheet" href="assets/css/style.compiled.css">
</head>

<body class="pb-20">
    <section class="w-full google-sans-normal min-h-[80dvh] flex flex-col" id="home">
        <div
            class="mx-auto transition-all w-full md:max-w-3xl lg:max-w-5xl xl:max-w-7xl h-auto md:grid md:grid-cols-2 gap-x-8">
            <div class="flex flex-col items-center">
                <div class="relative h-[280px] w-full">
                    <img src="assets/images/chonla-flipped.svg" alt=""
                        class="absolute bottom-0 left-[50%] translate-x-[-50%] w-full max-w-[400px]">
                </div>
            </div>
            <div class="flex flex-col pt-8 items-center pb-8 md:pb-0 md:items-end px-10 md:px-0">
                <nav class="flex space-x-4">
                    <a href="#home" aria-current="page"
                        class="px-3 py-2 text-lg text-slate-950 underline underline-offset-4 tracking-widest font-bold">Home</a>
                    <a href="#my-apps" class="px-3 py-2 text-lg text-slate-950 tracking-widest">My apps</a>
                </nav>
            </div>
        </div>
        <div class="flex flex-col flex-1 items-center text-center px-10 pt-10">
            <h1 class="mt-6 text-5xl md:text-6xl font-bold text-slate-800 tracking-widest">chonla</h1>
            <p class="mt-5 text-lg text-slate-800 text-center max-w-sm">Personal homepage, portfolio, and blog.</p>
            <div class="mt-6 flex gap-6">
                <a href="https://github.com/chonla"
                    class="bg-slate-950 text-slate-50 text-lg flex flex-row items-center rounded-md px-4 py-2 tracking-widest shadow-sm shadow-slate-400 hover:shadow-lg">
                    <img src="assets/images/GitHub_Invertocat_White.svg" alt="GitHub logo" class="inline size-5 mr-2">
                    GitHub
                </a>
            </div>
        </div>

    </section>

    <section class="w-full px-10 google-sans-normal flex flex-col pt-8 gap-8 scroll-mt-8" id="my-apps">
        <div class="mx-auto transition-all w-full md:max-w-3xl lg:max-w-5xl xl:max-w-7xl flex flex-col items-center">
            <h2 class="text-4xl font-bold text-slate-800">My apps</h2>
            <p class="mt-4 text-lg text-slate-800">Here are some of the apps I've developed. Click on any app to learn
                more about it.</p>
        </div>
        <div class="mx-auto transition-all w-full md:max-w-3xl lg:max-w-5xl xl:max-w-7xl md:grid md:grid-cols-3 gap-x-8">
            <a href="mega-stopwatch/"
                class="flex flex-col gap-y-8 pt-8 items-center shadow-sm shadow-slate-400 rounded-md p-4 hover:scale-105 hover:shadow-lg hover:bg-slate-100 transition-all duration-300">
                <img src="assets/images/mega-stopwatch/icon.png" alt="Mega Stopwatch app icon: the digits 1.23"
                    class="w-24 h-24 rounded-3xl shadow-md shadow-slate-400">
                <div class="flex flex-col items-center text-center">
                    <h3 class="text-2xl font-bold text-slate-950">Mega Stopwatch</h3>
                    <p class="mt-2 text-lg text-slate-800">The big stopwatch app that speaks literally.</p>
                </div>
            </a>
        </div>
    </section>
</body>

</html>
